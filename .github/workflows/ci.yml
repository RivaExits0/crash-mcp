name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb binutils
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0" pyelftools minidump capstone pytest
      - name: Run test suite
        run: make test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0" pyelftools minidump capstone pytest
      - name: Verify package imports on Windows
        run: python -c "import server, analyzer, elf_core, minidump_reader; print('imports OK')"
      - name: Run minidump parser tests (Windows-compatible)
        run: python -m pytest tests/test_minidump_mock.py -q
